# Reusable: build one service's linux/arm64 image, Trivy-gate it, push to ECR.
# (PETPLAT-53 — the shared unit called once per changed service by the matrix
# in build-push.yml. PETPLAT-105 — the CRITICAL scan gates the push.)
#
# Lives directly in .github/workflows/ (prefixed `reusable-`), NOT in a
# reusable/ subdirectory: GitHub Actions only loads workflow files that are
# direct children of .github/workflows/, so a `uses: ./.github/workflows/
# reusable/...` reference to a subdir is an invalid-workflow startup failure.
#
# A standalone reusable "ecr-login" workflow is not used: a called workflow
# runs as its own job, so a Docker login there would not carry into the
# caller's job. ECR login therefore lives here, in the same job as the build
# and push. The tag-update half (PETPLAT-50) is a reusable-shaped workflow in
# the PLATFORM repo (update-image-tags.yml), triggered by this pipeline's
# repository_dispatch.

name: build-scan-push (reusable)

on:
  workflow_call:
    inputs:
      service:
        description: "Service name — the ECR repo suffix and (with the spring-petclinic- prefix) the Maven module dir"
        required: true
        type: string
      sha:
        description: "7-character commit SHA to tag the image with"
        required: true
        type: string
    secrets:
      AWS_ROLE_ARN:
        required: true
      AWS_ACCOUNT_ID:
        required: true
      AWS_REGION:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    env:
      MODULE: spring-petclinic-${{ inputs.service }}
      IMAGE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/petclinic-dev/${{ inputs.service }}:${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build JAR — ${{ env.MODULE }}
        run: mvn -q -B -pl "${MODULE}" -am package -DskipTests

      - name: Resolve artifact name + exposed port
        id: meta
        run: |
          set -euo pipefail
          jar=$(find "${MODULE}/target" -maxdepth 1 -name 'spring-petclinic-*.jar' \
                 ! -name '*-plain.jar' ! -name '*sources*' | head -n1)
          [ -n "$jar" ] || { echo "::error::no runnable JAR in ${MODULE}/target"; exit 1; }
          echo "artifact=$(basename "$jar" .jar)" >> "$GITHUB_OUTPUT"
          # Runtime ports from the Service Inventory (technical-spec.md) — the
          # pom.xml docker.image.exposed.port values are stale for several
          # services. Only feeds the Dockerfile EXPOSE directive.
          case "${{ inputs.service }}" in
            config-server)     port=8888 ;;
            discovery-server)  port=8761 ;;
            api-gateway)       port=8080 ;;
            customers-service) port=8081 ;;
            visits-service)    port=8082 ;;
            vets-service)      port=8083 ;;
            genai-service)     port=8084 ;;
            admin-server)      port=9090 ;;
            *) echo "::error::unknown service '${{ inputs.service }}'"; exit 1 ;;
          esac
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 emulation on the x86 runner)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC — no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build linux/arm64 image — load locally, DO NOT push yet
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --build-arg ARTIFACT_NAME="${{ steps.meta.outputs.artifact }}" \
            --build-arg EXPOSED_PORT="${{ steps.meta.outputs.port }}" \
            -f docker/Dockerfile \
            -t "${IMAGE}" \
            --load \
            "${MODULE}/target"

      - name: Trivy scan — CRITICAL gates the push
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: CRITICAL
          exit-code: "1"          # CRITICAL found -> job fails -> push step never runs
          ignore-unfixed: false
          trivyignores: .trivyignore

      - name: Prepare results dir
        if: always()
        run: mkdir -p trivy-results

      - name: Trivy scan — HIGH+CRITICAL report (never blocks) -> artifact
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: json
          severity: HIGH,CRITICAL
          exit-code: "0"
          output: trivy-results/${{ inputs.service }}.json
          trivyignores: .trivyignore

      - name: Warn on HIGH vulnerabilities (informational)
        if: always()
        run: |
          count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' \
                     "trivy-results/${{ inputs.service }}.json" 2>/dev/null || echo 0)
          if [ "${count:-0}" -gt 0 ]; then
            echo "::warning title=Trivy HIGH::${{ inputs.service }} has ${count} HIGH vulnerabilit(y/ies) — not blocking. See the trivy-results artifact."
          fi

      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ inputs.service }}-${{ inputs.sha }}
          path: trivy-results/
          if-no-files-found: warn

      - name: Push image to ECR
        run: docker push "${IMAGE}"
